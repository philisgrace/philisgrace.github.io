<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>philis</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "Courier New", Courier, monospace;
  background-color: #EAE7DC;
  background-image:
    linear-gradient(to right, rgba(50,110,200,0.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(50,110,200,0.07) 1px, transparent 1px);
  background-size: 6px 6px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ---- MENUBAR ---- */
.menubar {
  height: 22px;
  background: rgba(238,238,238,0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(0,0,0,0.18);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 16px;
  flex-shrink: 0;
  user-select: none;
  z-index: 100;
}
.mb-apple { font-size: 14px; }
.mb-item {
  font-size: 11px;
  font-family: -apple-system, "Lucida Grande", sans-serif;
  font-weight: 500;
  color: #111;
  cursor: default;
}
.mb-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
}
.mb-right span {
  font-size: 11px;
  font-family: -apple-system, sans-serif;
  color: #111;
}

/* ---- DESKTOP ---- */
.desktop {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 36px 32px;
}

/* ---- MAIN WINDOW ---- */
.mac-window {
  width: 960px;
  max-width: 100%;
  background: #f0f0f0;
  border-radius: 8px 8px 6px 6px;
  border: 1px solid rgba(0,0,0,0.28);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.55) inset,
    0 24px 64px rgba(0,0,0,0.26),
    0 4px 12px rgba(0,0,0,0.14);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- AQUA TITLEBAR ---- */
.titlebar {
  height: 24px;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0, transparent 1px,
      rgba(255,255,255,0.3) 1px, rgba(255,255,255,0.3) 2px
    ),
    linear-gradient(to bottom,
      #d6ddf0 0%,
      #bac4dc 35%,
      #aeb8ce 52%,
      #bec8de 100%
    );
  border-bottom: 1px solid #8890a8;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 7px;
  flex-shrink: 0;
  position: relative;
  user-select: none;
}

.tl {
  width: 13px; height: 13px; border-radius: 50%;
  flex-shrink: 0;
  transition: filter 0.1s;
  cursor: default;
}
.tl:hover { filter: brightness(1.12); }
.tl-close {
  background: radial-gradient(circle at 38% 32%, #ff9090, #e02020 55%, #a01010);
  box-shadow: 0 1px 2px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
  border: 0.5px solid rgba(120,0,0,0.35);
}
.tl-min {
  background: radial-gradient(circle at 38% 32%, #ffe070, #e0a000 55%, #a07000);
  box-shadow: 0 1px 2px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
  border: 0.5px solid rgba(100,60,0,0.35);
}
.tl-max {
  background: radial-gradient(circle at 38% 32%, #80ee60, #20b020 55%, #108010);
  box-shadow: 0 1px 2px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
  border: 0.5px solid rgba(0,80,0,0.35);
}
.win-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 11px;
  font-family: -apple-system, "Lucida Grande", sans-serif;
  font-weight: 600;
  color: #333;
  white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255,255,255,0.65);
}

/* ---- WINDOW BODY ---- */
.win-body {
  display: grid;
  grid-template-columns: 440px 1fr;
}

/* left col */
.win-left {
  padding: 48px 44px 48px 48px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 20px;
  border-right: 1px solid rgba(0,0,0,0.12);
  background: #f4f4f4;
}

.heading {
  font-size: 58px;
  font-weight: 700;
  color: #2B52D6;
  line-height: 1;
  letter-spacing: -0.01em;
}

.bio {
  font-size: 11.5px;
  line-height: 1.9;
  color: #2B52D6;
  padding-bottom: 10px;
}

.folders { display: flex; gap: 28px; align-items: flex-end; }

.folder-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  text-decoration: none;
  transition: transform 0.16s cubic-bezier(0.34,1.56,0.64,1);
}
.folder-wrap:hover { transform: translateY(-6px); }

.folder-icon { position: relative; width: 58px; height: 50px; }
.f-tab {
  position: absolute; top: 0; left: 0;
  width: 23px; height: 9px;
  border-radius: 3px 3px 0 0;
}
.f-body {
  position: absolute; top: 7px; left: 0; right: 0; bottom: 0;
  border-radius: 3px 8px 8px 8px;
}
.f-body::after {
  content: "";
  position: absolute; top: 4px; left: 4px; right: 4px;
  height: 1.5px;
  background: rgba(255,255,255,0.55);
  border-radius: 1px;
}
.folder-wrap.green .f-tab  { background: #22A055; }
.folder-wrap.green .f-body { background: linear-gradient(165deg, #52DC82, #2CC068); }
.folder-wrap.sky .f-tab    { background: #3898D8; }
.folder-wrap.sky .f-body   { background: linear-gradient(165deg, #70C8FF, #40A8EE); }
.folder-wrap.pink .f-tab   { background: #C428A0; }
.folder-wrap.pink .f-body  { background: linear-gradient(165deg, #FF65CE, #DA38B0); }

.folder-label {
  font-size: 8.5px;
  text-align: center;
  color: #2B52D6;
  text-decoration: underline;
  text-underline-offset: 2px;
  line-height: 1.5;
}

.contact {
  font-size: 9px;
  color: rgba(43,82,214,0.4);
  margin-top: 4px;
}

/* right col */
.win-right {
  background: #e6e6e6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  min-height: 520px;
}
.win-right img {
  width: 100%;
  max-width: 380px;
  height: auto;
  display: block;
  border-radius: 4px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.18);
}
</style>
